name: Real model evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compare scorers on the golden set
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.compare

      - name: Evaluate the judge on labeled cases
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.judge_eval

      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
